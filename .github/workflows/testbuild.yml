name: Theme Catalog Updater

on:
  workflow_dispatch: # اجرای دستی
  push:
    branches: [main]
    paths:
      - 'themes/**' # مسیر فایل‌های تم شما

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # اجازه نوشتن در ریپو

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Run Python script
      run: |
        # ایجاد فایل پایتون
        cat << 'EOF' > generate_catalog.py
        import os
        import json
        from pathlib import Path

        BASE_URL = "https://raw.githubusercontent.com/{}/main".format(
            os.environ['GITHUB_REPOSITORY']
        )

        def find_related_files(file_path):
            """پیدا کردن فایل‌های مرتبط با تم"""
            base = file_path.with_suffix('')
            results = {'theme': file_path}
            
            # جستجوی تصویر
            for ext in ['.png', '.webp', '.jpg', '.jpeg']:
                if base.with_suffix(ext).exists():
                    results['image'] = base.with_suffix(ext)
                    break
            
            # جستجوی پس‌زمینه
            for bg in ['background.jpeg', 'back.jpeg', 'bg.jpeg']:
                bg_path = base.with_name(bg)
                if bg_path.exists():
                    results['background'] = bg_path
                    break
            
            return results

        def main():
            catalog = []
            themes_dir = Path('themes') # مسیر فایل‌های تم
            
            for theme_file in themes_dir.rglob('*.ghost'):
                files = find_related_files(theme_file)
                
                entry = {
                    'theme': f"{BASE_URL}/{files['theme']}",
                    'image': f"{BASE_URL}/{files.get('image', '')}" if files.get('image') else None,
                    'background': f"{BASE_URL}/{files.get('background', '')}" if files.get('background') else None,
                    'hasbackground': 'background' in files
                }
                catalog.append(entry)
            
            with open('themes.json', 'w') as f:
                json.dump(catalog, f, indent=2)

        if __name__ == '__main__':
            main()
        EOF
        
        # اجرای اسکریپت
        python generate_catalog.py
        
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add themes.json
        git commit -m "Auto-update theme catalog [skip ci]" || echo "No changes to commit"
        git push