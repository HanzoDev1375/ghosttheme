name: Update Theme Catalog

on:
  schedule:
    - cron: '0 0 * * *' # روزانه اجرا شود
  workflow_dispatch: # امکان اجرای دستی
  push:
    branches:
      - main
    paths:
      - '**/*.ghost'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.jpeg'
      - '**/*.jpg'

jobs:
  update-themes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install pyyaml
        
    - name: Run theme scanner script
      run: |
        cat << 'EOF' > theme_scanner.py
        import os
        import json
        from pathlib import Path

        def main():
            repo = os.environ.get('GITHUB_REPOSITORY')
            base_url = f'https://raw.githubusercontent.com/{repo}/main/'
            themes = []

            for root, _, files in os.walk('.'):
                for file in files:
                    if file.endswith('.ghost'):
                        theme_path = Path(root) / file
                        rel_path = str(theme_path.relative_to('.'))
                        theme = {
                            'theme': base_url + rel_path,
                            'image': None,
                            'background': None,
                            'hasbackground': False
                        }

                        # Find image
                        for ext in ['.png', '.webp', '.jpg', '.jpeg']:
                            img_path = theme_path.with_suffix(ext)
                            if img_path.exists():
                                theme['image'] = base_url + str(img_path.relative_to('.'))
                                break

                        # Find background
                        bg_path = theme_path.with_suffix('.jpeg')
                        if not bg_path.exists():
                            bg_path = theme_path.with_suffix('.jpg')
                        if bg_path.exists():
                            theme['background'] = base_url + str(bg_path.relative_to('.'))
                            theme['hasbackground'] = True

                        themes.append(theme)

            with open('themes.json', 'w') as f:
                json.dump(themes, f, indent=2)
            print(f"Generated catalog with {len(themes)} themes")

        if __name__ == '__main__':
            main()
        EOF
        
        python theme_scanner.py
        
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add themes.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update theme catalog"
        git push