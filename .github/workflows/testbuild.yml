name: Python CI and Theme Catalog

on:
  push:
    branches: [ "master" ]
    paths:
      - 'themes/**'
      - '**/*.py'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pyyaml
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      run: |
        pytest

  update-catalog:
    name: Update Theme Catalog
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
        
    - name: Generate theme catalog
      run: |
        cat << 'EOF' > generate_catalog.py
        import os
        import json
        from pathlib import Path

        BASE_URL = "https://raw.githubusercontent.com/{}/main".format(
            os.environ['GITHUB_REPOSITORY']
        )

        def find_assets(theme_path):
            base = theme_path.with_suffix('')
            assets = {
                'theme': theme_path,
                'image': None,
                'background': None
            }
            
            # Find preview image
            for ext in ['.png', '.webp', '.jpg', '.jpeg']:
                if base.with_suffix(ext).exists():
                    assets['image'] = base.with_suffix(ext)
                    break
            
            # Find background
            for bg in ['background.jpeg', 'back.jpeg', 'bg.jpeg', 'background.jpg']:
                bg_path = base.with_name(bg)
                if bg_path.exists():
                    assets['background'] = bg_path
                    break
            
            return assets

        def main():
            catalog = []
            themes_dir = Path('themes')
            
            for theme_file in themes_dir.rglob('*.ghost'):
                assets = find_assets(theme_file)
                
                entry = {
                    'theme': f"{BASE_URL}/{assets['theme']}",
                    'image': f"{BASE_URL}/{assets['image']}" if assets['image'] else None,
                    'background': f"{BASE_URL}/{assets['background']}" if assets['background'] else None,
                    'hasbackground': assets['background'] is not None
                }
                catalog.append(entry)
            
            with open('themes.json', 'w') as f:
                json.dump(catalog, f, indent=2)
            print(f"Generated catalog with {len(catalog)} themes")

        if __name__ == '__main__':
            main()
        EOF
        
        python generate_catalog.py
        
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add themes.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update theme catalog [skip ci]"
        git push