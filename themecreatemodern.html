<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Theme Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./theme-studio.css">
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-palette"></i>
          <h2>Ghost Theme Studio</h2>
        </div>
        <div class="file-input-container">
          <div class="tab-buttons">
            <button class="tab-btn active" data-tab="file">Import File</button>
            <button class="tab-btn" data-tab="paste">Paste JSON</button>
          </div>
          <div class="tab-content file-tab active">
            <label for="fileInput" class="file-input-label">
              <i class="fas fa-file-import"></i>
              <p>
                Drag &amp; drop a theme file or 
                <strong>click to browse</strong>
              </p>
              <p class="small">Supports .json or .ghost files</p>
            </label>
            <input type="file" id="fileInput" accept=".json,.ghost">
          </div>
          <div class="tab-content paste-tab">
            <textarea id="jsonPaste" placeholder="Paste your theme JSON here..."></textarea>
            <button id="loadJsonBtn" class="btn btn-primary">
              <i class="fas fa-play"></i>
               Load Theme
            </button>
          </div>
        </div>
        <div class="theme-name">
          <input type="text" id="themeName" placeholder="Theme name...">
        </div>
        <div class="sidebar-content" id="themeGroups"></div>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="saveTheme()">
            <i class="fas fa-save"></i>
             Save Theme
          </button>
          <button class="btn btn-secondary" onclick="resetEditor()">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </aside>
      <main class="editor-area">
        <header class="editor-header">
          <i class="fas fa-file-code"></i>
          <span>
            GhostTheme ▸ preview ▸ 
            <strong>demo.js</strong>
          </span>
        </header>
        <div id="editorContainer" class="editor-preview">
          <div class="empty-state">
            <i class="fas fa-code"></i>
            <h3>No Theme Loaded</h3>
            <p>Import a Ghost theme file or paste JSON to start editing</p>
          </div>
        </div>
        <div class="status-bar">
          <span id="statusMessage">Ready</span>
          <span>
            <span id="colorCount">0</span>
             colors
          </span>
        </div>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jscolor/2.4.6/jscolor.min.js">
 			   
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js">
 			   
    </script>
    <script src="script.js">
 			   
    </script>
  </body>
</html>
